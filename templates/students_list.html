{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Senarai Pendaftaran Pelajar</h2>
    </div>

    <form action="{{ url_for('view_students') }}" method="GET" class="well form-inline">
        <div class="form-group">
            <input type="text" name="search" class="form-control" placeholder="Cari Nama atau KP...">
        </div>
        <button type="submit" class="btn btn-primary"><span class="glyphicon glyphicon-search"></span> Cari</button>
        <a href="{{ url_for('view_students') }}" class="btn btn-default">Reset</a>
    </form>

    <table class="table table-hover table-bordered" style="background-color: white;">
        <thead>
            <tr class="bg-primary">
                <th>ID</th>
                <th>Nama Pelajar</th>
                <th>No. KP</th>
                <th style="width: 150px;">Tindakan</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.no_pendaftaran_pelajar }}</td>
                <td>{{ s.nama_pelajar }}</td>
                <td>{{ s.no_kp_pelajar }}</td>
                <td>
                    <a href="{{ url_for('admin_view_profile', student_id=s.no_pendaftaran_pelajar) }}"
                        class="btn btn-info btn-sm">
                        <span class="glyphicon glyphicon-eye-open"></span> Lihat Profil
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">Tiada rekod dijumpai.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Statistik Pendaftaran Kokurikulum</h2>

    <div class="well well-sm">
        <form method="GET" class="form-inline" style="display: flex; align-items: center; gap: 15px;">
            <div class="form-group">
                <label>Kategori:</label>
                <select name="cat" class="form-control" onchange="this.form.submit()">
                    <option value="all">Semua Kategori</option>
                    <option value="Kelab" {% if request.args.get('cat')=='Kelab' %}selected{% endif %}>Kelab</option>
                    <option value="Badan Beruniform" {% if request.args.get('cat')=='Badan Beruniform' %}selected{%
                        endif %}>Badan Beruniform</option>
                    <option value="Sukan dan Permainan" {% if request.args.get('cat')=='Sukan dan Permainan'
                        %}selected{% endif %}>Sukan dan Permainan</option>
                </select>
                <label>Semester:</label>
                <select name="semester" class="form-control" onchange="this.form.submit()">
                    <option value="all">Semua</option>
                    {% for s in [1, 2, 3] %}
                    <option value="{{ s }}" {% if request.args.get('semester')|int==s %}selected{% endif %}>
                        {{ s }}
                    </option>
                    {% endfor %}
                </select>
                <label>Rumah Sukan:</label>
                <select name="rumah" class="form-control" onchange="this.form.submit()">
                    <option value="all">Semua Rumah</option>
                    {% for rumah in ['Merah', 'Biru', 'Kuning', 'Hijau', 'Ungu'] %}
                    <option value="{{ rumah }}" {% if request.args.get('rumah')==rumah %}selected{% endif %}>
                        {{ rumah }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <a href="{{ url_for('export_koku_stats', semester=request.args.get('semester', 'all'), cat=request.args.get('cat', 'all')) }}"
                class="btn btn-success">
                <i class="glyphicon glyphicon-download-alt"></i> Eksport ke CSV        
            </a>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
                <tr class="active">
                    <th>Nama Unit</th>
                    <th>Kategori</th>
                    <th class="text-center">Bilangan Pelajar</th>
                </tr>
            </thead>
            <tbody>
                {% for u in units %}
                <tr>
                    <td>{{ u.unit_name }}</td>
                    <td>{{ u.unit_type }}</td>
                    <td class="text-center"><strong>{{ u.student_count }}</strong></td>
                </tr>
                {% endfor %}    </tbody>
        </table>
    </div>
</div>
{% endblock %}

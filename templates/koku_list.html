{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Senarai Pelajar Kokurikulum</h2>

    <form method="GET" class="form-inline mb-4">
        <select name="category" id="catSelect" class="form-control" onchange="filterActivities()">
            <option value="">Semua Kategori</option>
            <option value="Kelab" {% if cat=='Kelab' %}selected{% endif %}>Kelab</option>
            <option value="Badan Beruniform" {% if cat=='Badan Beruniform' %}selected{% endif %}>Badan Beruniform</option>
            <option value="Sukan dan Permainan" {% if cat=='Sukan dan Permainan' %}selected{% endif %}>Sukan dan Permainan
            </option>
        </select>
    
        <select name="activity" id="actSelect" class="form-control">
            <option value="">Semua Aktiviti</option>
            {% for u in all_units %}
            <option value="{{ u.activity_name }}" data-type="{{ u.unit_type }}" {% if act==u.activity_name %}selected{%
                endif %}>
                {{ u.activity_name }}
            </option>
            {% endfor %}
        </select>
        <select name="rumah" class="form-control">
            <option value="">Semua Rumah Sukan</option>
            <option value="Merah" {% if rumah=='Merah' %}selected{% endif %}>Merah</option>
            <option value="Biru" {% if rumah=='Biru' %}selected{% endif %}>Biru</option>
            <option value="Kuning" {% if rumah=='Kuning' %}selected{% endif %}>Kuning</option>
            <option value="Hijau" {% if rumah=='Hijau' %}selected{% endif %}>Hijau</option>
        </select>
        
        <button type="submit" class="btn btn-primary">Tapis</button>
        </form>

        <table class="table table-striped table-hover">
            <thead>
                <tr class="active">
                    <th>Nama</th>
                    <th>Unit</th>
                    <th>Jawatan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td><strong>{{ s.nama_pelajar }}</strong></td>
                    <td>{{ s.activity_name }} <br><small>{{ s.unit_type }}</small></td>
                    <td>
                        <form action="{{ url_for('update_jawatan_ajax') }}" method="POST">
                            <input type="hidden" name="kkplr_id" value="{{ s.kkplr_id }}">
                    
                            <select name="jawatan" class="form-control input-sm" onchange="this.form.submit()">
                                {% for j in ['AHLI', 'PENGERUSI', 'NAIB PENGERUSI', 'SETIAUSAHA', 'NAIB SETIAUSAHA',
                                'BENDAHARI', 'NAIB BENDAHARI', 'AHLI JAWATANKUASA', 'KETUA BIRO',
                                'KETUA KELAS', 'PENOLONG KETUA KELAS'] %}
                                <option value="{{ j }}" {% if s.jawatan==j %}selected{% endif %}>{{ j }}</option>
                                {% endfor %}
                            </select>
                        </form>               </td>
                    <td>
                        <a href="{{ url_for('edit_student_koku', bil=s.bil_kemasukan) }}" class="btn btn-sm btn-warning">Edit</a>
                    </td>
                </tr>
                {% endfor %}    
            </tbody>
        </table>
        </div>

    <nav>
        <ul class="pagination">
            <li class="page-item"><a class="page-link" href="?page={{ page - 1 }}">Sebelum</a></li>
            <li class="page-item"><a class="page-link" href="?page={{ page + 1 }}">Selepas</a></li>
        </ul>
    </nav>
</div>

<script>
    function filterActivities() {
        var cat = document.getElementById('catSelect').value;
        var actSelect = document.getElementById('actSelect');
        var options = actSelect.options;

        for (var i = 1; i < options.length; i++) {
            if (cat === "" || options[i].getAttribute('data-type') === cat) {
                options[i].style.display = "block";
            } else {
                options[i].style.display = "none";
            }
        }
    }
    // Run on load to set correct visibility
    filterActivities();
</script>

{% endblock %}

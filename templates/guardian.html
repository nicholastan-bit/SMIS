{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Maklumat Penjaga</h2>
    <p class="text-muted">Sila isi maklumat penjaga. Anda boleh menambah lebih daripada satu penjaga.</p>
    <hr>

    <form action="/submit_guardians" method="POST"
        onsubmit="return confirm('Adakah anda pasti maklumat penjaga ini adalah betul sebelum menghantar?');">
        <div id=\"guardian-container\">
            {% if existing_guardians %}
            {% for g in existing_guardians %}
            <div class="panel panel-info guardian-entry">
                <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 class="panel-title">Penjaga <span class="guardian-count">{{ loop.index }}</span></h3>
                    <button type="button" class="btn btn-danger btn-xs btn-remove" onclick="removeGuardian(this)" {% if
                        loop.length==1 %}style="display:none;" {% endif %}>
                        <span class="glyphicon glyphicon-trash"></span> Buang
                    </button>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label>Nama Penuh</label>
                            <input type="text" name="g_nama_penjaga[]" class="form-control" value="{{ g.nama_penjaga }}"
                                required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>No. Kad Pengenalan</label>
                            <input type="text" name="g_no_kp_penjaga[]" class="form-control"
                                value="{{ g.no_kp_penjaga }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label>Hubungan</label>
                            <input type="text" name="g_hubungan[]" class="form-control"
                                placeholder="Contoh: BAPA, IBU, ABANG" value="{{ g.penjaga }}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>No. Telefon</label>
                            <input type="tel" name="g_no_telefon[]" class="form-control"
                                placeholder="Contoh: 0123456789" pattern="[0-9]+"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                value="{{ g.no_telefon if g.no_telefon else '' }}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Pekerjaan</label>
                            <input type="text" name="g_pekerjaan[]" class="form-control" value="{{ g.pekerjaan }}"
                                required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label>Pendapatan Sebulan (RM)</label>
                            <input type="number" step="0.01" name="g_pendapatan[]" class="form-control"
                                placeholder="0.00" value="{{ g.pendapatan }}" required>
                        </div>
                        <div class="col-md-8 form-group">
                            <label>Alamat Tempat Kerja</label>
                            <textarea name="g_alamat_kerja[]" class="form-control" rows="1"
                                required>{{ g.alamat_tempat_kerja }}</textarea>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="panel panel-info guardian-entry">
                <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 class="panel-title">Penjaga <span class="guardian-count">1</span></h3>
                    <button type="button" class="btn btn-danger btn-xs btn-remove" onclick="removeGuardian(this)"
                        style="display:none;">
                        <span class="glyphicon glyphicon-trash"></span> Buang
                    </button>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label>Nama Penuh</label>
                            <input type="text" name="g_nama_penjaga[]" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>No. Kad Pengenalan</label>
                            <input type="text" name="g_no_kp_penjaga[]" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label>Hubungan</label>
                            <input type="text" name="g_hubungan[]" class="form-control"
                                placeholder="Contoh: BAPA, IBU, ABANG" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>No. Telefon</label>
                            <input type="tel" name="g_no_telefon[]" class="form-control"
                                placeholder="Contoh: 0123456789" pattern="[0-9]+"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Pekerjaan</label>
                            <input type="text" name="g_pekerjaan[]" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label>Pendapatan Sebulan (RM)</label>
                            <input type="number" step="0.01" name="g_pendapatan[]" class="form-control"
                                placeholder="0.00" required>
                        </div>
                        <div class="col-md-8 form-group">
                            <label>Alamat Tempat Kerja</label>
                            <textarea name="g_alamat_kerja[]" class="form-control" rows="1" required></textarea>
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}
        </div>

        <div class="form-group">
            <button type="button" class="btn btn-info" onclick="addGuardian()">
                <span class="glyphicon glyphicon-plus"></span> Tambah Penjaga Baru
            </button>
        </div>

        <hr>
        <button type="submit" class="btn btn-success btn-lg btn-block">Simpan Semua Maklumat Penjaga</button>
    </form>
</div>

<script type="text/javascript">
    function addGuardian() {
        const container = document.getElementById('guardian-container');
        const entries = document.getElementsByClassName('guardian-entry');

        // Clone the first guardian box
        const newEntry = entries[0].cloneNode(true);

        // Clear all inputs in the cloned box
        const inputs = newEntry.querySelectorAll('input, textarea');
        inputs.forEach(input => input.value = '');

        // Show the delete button for the new entry
        const removeBtn = newEntry.querySelector('.btn-remove');
        removeBtn.style.display = 'block';

        container.appendChild(newEntry);
        updateNumbers();
    }

    function removeGuardian(button) {
        const entry = button.closest('.guardian-entry');
        entry.remove();
        updateNumbers();
    }

    function updateNumbers() {
        const entries = document.getElementsByClassName('guardian-entry');
        const counts = document.getElementsByClassName('guardian-count');

        for (let i = 0; i < entries.length; i++) {
            counts[i].innerText = i + 1;

            const removeBtn = entries[i].querySelector('.btn-remove');
            if (entries.length === 1) {
                removeBtn.style.display = 'none';
            } else {
                removeBtn.style.display = 'block';
            }
        }
    }
</script>
{% endblock %}
